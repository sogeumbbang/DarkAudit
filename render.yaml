services:
  - type: web
    name: darkaudit-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DARKAUDIT_PROVIDER
        value: openai
      - key: DARKAUDIT_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FIGMA_ACCESS_TOKEN
        sync: false
      - key: BROWSERSTACK_USERNAME
        sync: false
      - key: BROWSERSTACK_ACCESS_KEY
        sync: false
      - key: BROWSERSTACK_ANDROID_DEVICE
        value: Google Pixel 8
      - key: BROWSERSTACK_ANDROID_VERSION
        value: "14.0"
      - key: DARKAUDIT_CORS_ORIGINS
        sync: false
