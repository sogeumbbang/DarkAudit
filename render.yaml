services:
  - type: web
    name: darkaudit-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DARKAUDIT_PROVIDER
        value: fake
      - key: DARKAUDIT_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FIGMA_ACCESS_TOKEN
        sync: false
      - key: DARKAUDIT_CORS_ORIGINS
        sync: false
