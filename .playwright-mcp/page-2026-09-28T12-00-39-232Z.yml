                - heading "GM1 Ganglioside" [level=3] [ref=f17e220]
                - paragraph [ref=f17e221]: Supporting vital neuronal functions through protection, modulation, and repair.
              - generic [ref=f17e222]:
                - paragraph [ref=f17e224]:
                  - text: GM1 ganglioside is a naturally occurring lipid found in high concentrations in the nervous system. It is known to be essential for supporting healthy nerve cell function, communication, and protection.
                  - superscript [ref=f17e225]: "9"
                  - text: TRB has long-standing experience in the research and development of GM1. Our scientific focus is on its potential neuroprotective and restorative properties for applications in complex neurodegenerative conditions.
