                - heading "Hyaluronic acid" [level=3] [ref=f17e199]
                - paragraph [ref=f17e200]: The unique molecule at the heart of TRB's products.
              - generic [ref=f17e201]:
                - paragraph [ref=f17e203]:
                  - text: Hyaluronic acid is a naturally occurring substance essential for maintaining hydration and tissue integrity in the eyes, skin, and joints. It is a vital component for lubrication and is known to support tissue function.
                  - superscript [ref=f17e204]: "8"
                  - text: At TRB, we have developed deep expertise in pharmaceutical-grade sodium hyaluronate. Our research focuses on its applications in musculoskeletal health and ophthalmology.
                - link "Find out more" [ref=f17e205] [cursor=pointer]:
                  - /url: https://www.trbchemedica.com/expertise/hyaluronic-acid/
