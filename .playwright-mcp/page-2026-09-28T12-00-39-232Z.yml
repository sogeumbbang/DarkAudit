                - paragraph [ref=f17e180]: Supporting joint health by targeting inflammation.
              - generic [ref=f17e181]:
                - paragraph [ref=f17e183]: Diacerein targets inflammation by inhibiting interleukin-1 (IL-1), a key mediator in osteoarthritis progression. In addition to pain relief, it may slow structural changes in the joint. Our work with diacerein reflects a commitment to disease-modifying strategies in musculoskeletal care.
