<!doctype html>
<html lang="ko"><meta charset="utf-8"><style>
* {box-sizing:border-box} body {margin:0;background:#f6f8fa;font-family:Arial,"Noto Sans CJK KR",sans-serif;color:#1b2925;padding:36px;font-size:18px} main {background:white;border:1px solid #dce3df;border-radius:16px;padding:32px} h1 {font-size:28px;margin:0 0 20px} p {line-height:1.6} label {display:flex;align-items:center;gap:14px;padding:22px 0;border-bottom:1px solid #ddd} input {appearance:none;flex-shrink:0;width:24px;height:24px;border:2px solid #718078;border-radius:4px;margin:0} input:checked {background:#166f51;border-color:#166f51} input:checked::after {content:'✓';display:block;color:white;text-align:center;font-size:19px;line-height:20px} button {font:inherit;padding:18px;border:1px solid #166f51;border-radius:8px;background:#166f51;color:white;margin:10px 0;width:100%} .secondary {background:white;color:#166f51} .risky .secondary {border:0;font-size:12px;color:#999;padding:8px} .benefit {font-size:26px;color:#125e46;font-weight:bold} .notice {font-size:20px;color:#1b2925;line-height:1.6} .risky .notice {font-size:10px;color:#b7beb9} small {font-size:16px;color:#58655e}
.clean .secondary {background:#166f51;color:white} .clean .notice {font-size:26px;font-weight:bold;color:#125e46}
</style><main id="content"></main><script>
const query=new URLSearchParams(location.search);const risky=query.get('variant')==='risky';document.body.className=risky?'risky':'clean';
const firstPrice=risky?'9,900':'11,400';
const templates={
emotion:`<small>서비스 가입 안내</small><h1>혜택 알림 서비스</h1><p>무료 선택 서비스입니다.</p><p data-target>${risky?'지금 동의하지 않으면 준비된 혜택이 모두 사라집니다. 놓치고 후회하시겠어요?':'혜택 알림 수신에 동의하거나 동의하지 않을 수 있습니다.'}</p><p>선택하지 않아도 기본 서비스는 이용할 수 있습니다.</p>`,
'price-first':`<small>1단계 · 상품 안내</small><h1>안심보험</h1><p>기본 보장 플랜</p><p data-target class="benefit">월 납입금 총액 ${firstPrice}원</p>${risky?'':'<p>기본 보험료 9,900원 + 필수 계약관리수수료 1,500원</p>'}<p>추가 보장 옵션 없음</p>`,
'price-last':`<small>2단계 · 동일 플랜 가입 확인</small><h1>안심보험</h1><p>기본 보험료 9,900원<br>필수 계약관리수수료 1,500원</p><p data-target class="benefit">월 납입금 총액 11,400원</p><p>추가 보장 옵션 없음</p>`,
consent:`<small>첫 실행 · 기본 설정</small><h1>금융 서비스 환경 설정</h1><p>선택사항을 확인해 주세요.</p><label><input data-target type="checkbox"><span>[선택] 광고성 마케팅 정보 수신</span></label><label><input data-target type="checkbox"><span>[선택] 제휴사 개인정보 제공</span></label><label><input data-target type="checkbox"><span>[선택] 펀드 만기 시 자동 재투자</span></label><p>선택 동의 없이도 기본 서비스를 이용할 수 있습니다.</p>`,
hierarchy:`<small>선택 서비스 안내</small><h1>제휴 신용카드 신청</h1><p>연회비 10,000원. 카드 신청은 선택사항입니다.</p><button data-target>제휴카드 신청하기</button><button class="secondary">신청하지 않고 계속하기</button>`,
information:`<small>금융상품 안내</small><h1>스마트 투자 상품</h1><p class="benefit">다양한 자산에 분산 투자</p><p>투자 기간: 12개월<br>최소 가입 금액: 10만원</p><p data-target class="notice">이 상품은 원금 손실이 최대 100%까지 발생할 수 있으며 예금자보호 대상이 아닙니다.</p>`};
document.querySelector('#content').innerHTML=templates[query.get('case')];if(risky)document.querySelectorAll('input').forEach(input=>input.checked=true);
</script></html>
